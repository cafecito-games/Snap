name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build XCFrameworks and publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer || true

      - name: Run source test suite
        run: xcrun swift test

      - name: Build XCFrameworks
        run: ./Scripts/build-xcframeworks.sh dist

      - name: Verify binary distribution
        run: ./Scripts/verify-binary-distribution.sh dist

      - name: Generate binary manifest
        run: ./Scripts/generate-binary-manifest.sh "${GITHUB_REF_NAME}" dist dist/Package.swift

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.xcframework.zip \
            dist/checksums.txt \
            dist/Package.swift \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Publish binary manifest branch
        run: |
          BRANCH_DIR="$(mktemp -d)"
          cp dist/Package.swift "$BRANCH_DIR/Package.swift"
          cat > "$BRANCH_DIR/README.md" <<'EOF'
          # Snap (binary distribution)

          This branch is auto-generated by the release pipeline. Its
          `Package.swift` resolves every product to the prebuilt XCFrameworks
          attached to the latest release, so consumers compile no Snap sources.

          Usage:

              .package(url: "https://github.com/cafecito-games/Snap", branch: "binary")

          For a version-pinned binary dependency, use the matching
          `binary-<tag>` tag:

              .package(url: "https://github.com/cafecito-games/Snap", exact: "binary-0.1.0")

          The source distribution lives on `main`.
          EOF
          cd "$BRANCH_DIR"
          git init -q
          git checkout -q -b binary
          git add Package.swift README.md
          git -c user.name="Release Bot" -c user.email="actions@github.com" \
            commit -qm "Binary distribution for $GITHUB_REF_NAME"
          git tag -f "binary-${GITHUB_REF_NAME}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            binary:binary "binary-${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
